spring.datasource.url=jdbc:mysql://127.0.0.1:3307/\
  litflix_book_store_db?useSSL=false&allowPublicKeyRetrieval=\
  true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.docker.compose.enabled=false

jwt.expiration-time=604800000
jwt.secret=UnbreakableSecureKeyForAccessControl2025

